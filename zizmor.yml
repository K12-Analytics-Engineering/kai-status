# zizmor configuration for kai-status.
#
# Every workflow in .github/workflows/ is generated by Upptime and rewritten
# by update-template.yml, so we don't control the workflow text: we can't pin
# its actions, scope its tokens or set persist-credentials on its checkouts.
# The four audits below are always set off by that generated text, so they
# are disabled for the whole repo. Every other audit stays on, so a real
# regression (for example passing toJson(secrets) to a step) is still caught.
rules:
  # Upptime's actions are referenced by tag, not by commit SHA.
  unpinned-uses:
    disable: true
  # The generated create-github-app-token steps take no permission-* inputs.
  github-app:
    disable: true
  # The generated jobs set no narrow permissions blocks.
  excessive-permissions:
    disable: true
  # The generated checkouts don't set persist-credentials: false.
  artipacked:
    disable: true
