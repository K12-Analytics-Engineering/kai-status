name: Updates CI
on:
  # Scheduled runs disabled: Upptime regenerates workflows with
  # a SECRETS_CONTEXT env var containing every secret, which exposes org secrets to a
  # third-party action and trips GitHub's malicious-workflow detection.
  # Run manually and re-remove SECRETS_CONTEXT afterwards.
  repository_dispatch:
    types: [updates]
  workflow_dispatch:
jobs:
  release:
    name: Deploy updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update code
        uses: upptime/updates@master
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
